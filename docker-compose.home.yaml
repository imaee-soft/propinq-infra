# Homelab / homeserver (LXC servidor-docker)
# Layout esperado:
#   /srv/apps/propinq/
#     propinq-api/
#     propinq-frontend/
#     infra/   ← este compose
#
# Público: Cloudflare Tunnel dedicado (cloudflared_propinq), NO el túnel de nacho-bot.
# Requiere .env.api .env.mysql .env.mongodb .env.nginx .env.tunnel

services:
  api:
    build:
      context: ../propinq-api
      dockerfile: Dockerfile.prod
    container_name: propinq-api-prod
    env_file:
      - .env.api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    depends_on:
      - mysql-db
      - mongodb
    networks:
      - docker_net
    # 8080 del host suele estar ocupado (FileBrowser); usar 18080 en homeserver
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

  frontend:
    build:
      # Dockerfile.prod del frontend espera contexto = repo frontend
      context: ../propinq-frontend
      dockerfile: Dockerfile.prod
    container_name: propinq-frontend-prod
    depends_on:
      - api
    networks:
      - docker_net
    restart: unless-stopped

  mysql-db:
    image: mysql:8
    container_name: mysql-db-prod
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
      - label=disable
    env_file:
      - .env.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - docker_net
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: mongodb-prod
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
      - label=disable
    env_file:
      - .env.mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - docker_net
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-prod
    depends_on:
      - mysql-db
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    networks:
      - docker_net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-propinq-prod
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
      - label=disable
    ports:
      - "192.168.1.21:80:80"
      - "192.168.1.21:443:443"
    env_file:
      - .env.nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.cloudflare.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - docker_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_propinq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
    env_file:
      - .env.tunnel
    command: tunnel --protocol http2 run
    depends_on:
      - nginx
    networks:
      - docker_net

  certbot:
    image: certbot/certbot:latest
    container_name: certbot-propinq-prod
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    networks:
      - docker_net

volumes:
  mysql-data:
  mongo-data:
  metabase-data:
  nginx_logs:

networks:
  docker_net:
    external: true
    name: docker_net
