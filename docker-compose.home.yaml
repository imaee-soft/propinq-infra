# Desarrollo local (build contexts relativos).
# Producción: docker-compose.prod.yaml
#
# Requiere .env.api .env.mysql .env.mongodb .env.nginx
# Túnel Cloudflare (solo producción): .env.tunnel + --profile tunnel
# Certbot (bootstrap SSL): --profile tools

services:
  api:
    build:
      context: ../propinq-api
      dockerfile: Dockerfile.prod
    container_name: propinq-api-prod
    env_file:
      - .env.api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    depends_on:
      - mysql-db
      - mongodb
    networks:
      - app-network
    ports:
      - "127.0.0.1:18080:8080"
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0

  frontend:
    build:
      context: ../propinq-frontend
      dockerfile: Dockerfile.prod
    container_name: propinq-frontend-prod
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25

  mysql-db:
    image: mysql:8
    container_name: mysql-db-prod
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
      - label=disable
    env_file:
      - .env.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 0.5

  mongodb:
    image: mongo:6
    container_name: mongodb-prod
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
      - label=disable
    env_file:
      - .env.mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-prod
    depends_on:
      - mysql-db
    env_file:
      - .env.metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db/metabase.db
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
      MB_SITE_URL: https://metabase.propinq.online
      MB_ENABLE_EMBEDDING_STATIC: "true"
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-propinq-prod
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
      - label=disable
    ports:
      - "80:80"
    env_file:
      - .env.nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.local.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - app-network
    mem_limit: 64m
    cpus: 0.1

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_propinq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:false
      - apparmor:unconfined
    env_file:
      - .env.tunnel
    command: tunnel --protocol http2 run
    depends_on:
      - nginx
    networks:
      - app-network
    mem_limit: 64m
    cpus: 0.1

  certbot:
    image: certbot/certbot:latest
    container_name: certbot-propinq-prod
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    networks:
      - app-network
    mem_limit: 64m
    cpus: 0.1

volumes:
  mysql-data:
  mongo-data:
  metabase-data:
  nginx_logs:

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-propinq
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
