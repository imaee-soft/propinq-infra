services:
  api:
    build:
      context: ../propinq-api
      dockerfile: Dockerfile.prod
    container_name: propinq-api-prod
    env_file:
      - .env.api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    depends_on:
      - mysql-db
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ../propinq-frontend
      dockerfile: Dockerfile.prod
    container_name: propinq-frontend-prod
    depends_on:
      - api
    networks:
      - app-network

  mysql-db:
    image: mysql:8
    container_name: mysql-db-prod
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    env_file:
      - .env.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  mongodb:
    image: mongo:6
    container_name: mongodb-prod
    ports:
      - "${MONGO_PORT:-27017}:27017"
    env_file:
      - .env.mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-prod
    depends_on:
      - mysql-db
    env_file:
      - .env.metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-propinq-prod
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.nginx
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: always
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot-propinq-prod
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    networks:
      - app-network

volumes:
  mysql-data:
  mongo-data:
  metabase-data:
  nginx_logs:

networks:
  app-network:
    driver: bridge

