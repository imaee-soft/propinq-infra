# Stack local de respaldo (Windows / Docker Desktop).
# Sin reverse proxy nginx-propinq y sin Cloudflare Tunnel.
#
# Uso:
#   docker compose -f docker-compose.local.yaml up -d
#   App:      http://localhost:8088
#   API:      http://localhost:8080
#   Metabase: http://localhost:3030
#
# Restaurar datos del homeserver antes del primer arranque completo:
#   powershell -File scripts/restore-local.ps1

name: propinq-local

services:
  api:
    image: infra-api:latest
    build:
      context: ../propinq-api
      dockerfile: Dockerfile.prod
    container_name: propinq-api-local
    env_file:
      - .env.api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_SQL_INIT_MODE: never
      CORS_ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088,http://localhost:8080
      FRONTEND_URL: http://localhost:8088
      METABASE_SITE_URL: http://localhost:3030
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/propinq
    depends_on:
      mysql-db:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: infra-frontend:latest
    build:
      context: ../propinq-frontend
      dockerfile: Dockerfile.prod
    container_name: propinq-frontend-local
    depends_on:
      - api
    ports:
      - "8088:80"
    volumes:
      - ./nginx/frontend-local.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  mysql-db:
    image: mysql:8
    container_name: mysql-db-local
    env_file:
      - .env.mysql
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      default:
        aliases:
          - mysql-db
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: mongodb-local
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase-local
    depends_on:
      mysql-db:
        condition: service_healthy
    env_file:
      - .env.metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db/metabase.db
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
      MB_SITE_URL: http://localhost:3030
      MB_ENABLE_EMBEDDING_STATIC: "true"
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "3030:3000"
    restart: unless-stopped

volumes:
  mysql-data:
  mongo-data:
  metabase-data:
