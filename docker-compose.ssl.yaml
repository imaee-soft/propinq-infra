services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-propinq-ssl-bootstrap
    ports:
      - "80:80"
    volumes:
      # Config mínimo solo HTTP para el desafío ACME (sin bloque 443)
      - ./nginx/ssl-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      # Carpeta compartida para el desafío ACME
      - ./certbot/www:/var/www/certbot:ro
      # Carpeta donde luego Nginx leerá los certificados (después del certonly)
      - ./certbot/conf:/etc/nginx/ssl:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot-propinq-ssl-bootstrap
    volumes:
      # Certbot escribe aquí los archivos de desafío
      - ./certbot/www:/var/www/certbot:rw
      # Certbot guarda aquí los certificados (.pem)
      - ./certbot/conf:/etc/letsencrypt:rw

networks:
  default:
    name: app-network
    external: false

